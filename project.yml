name: GymTracker
options:
  bundleIdPrefix: com.manthannimodiya
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
targets:
  GymTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GymTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manthannimodiya.gymtracker
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Gym Tracker"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSMotionUsageDescription: "Used to show your daily step count on the Plan tab."
        ENABLE_ON_DEMAND_RESOURCES: "NO"
